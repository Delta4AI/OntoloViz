[project]
name = "ontoloviz"
dynamic = ["version"]
description = "OntoloViz: drug- and phenotype-ontology visualization (desktop GUI + web app + FastAPI server)"
authors = [
    {name = "Matthias Ley", email = "matthias.ley@delta4.ai"},
]
readme = "README.md"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
license = "MIT"
keywords = ["MeSH", "ATC", "ontology", "visualization", "sunburst", "drug", "phenotype", "GUI"]
requires-python = ">=3.10,<4.0"
dependencies = [
    "plotly>=5.15.0",
    "openpyxl>=3.1.2",
    "packaging>=23.0",
    "requests>=2.31.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.urls]
"Repository" = "https://github.com/Delta4AI/OntoloViz"
"Bug Tracker" = "https://github.com/Delta4AI/OntoloViz/issues"
"Releases" = "https://github.com/Delta4AI/OntoloViz/releases"

[project.scripts]
ontoloviz = "ontoloviz.app:run_app"
ontoloviz-server = "ontoloviz_server.main:run"

[build-system]
requires = ["setuptools>=80.8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["ontoloviz*", "ontoloviz_server*"]

[tool.setuptools.package-data]
ontoloviz = ["assets/*"]
ontoloviz_server = ["web_dist/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Legacy desktop GUI (src/ontoloviz/) predates the ruff config and is not
# style-managed by ruff; only the server + tests participate in lint.
extend-exclude = ["src/ontoloviz", "templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
