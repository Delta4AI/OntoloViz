# pnpm reads settings from here, not from the package.json "pnpm" field.
#
# The problem: esbuild ships a postinstall build script. pnpm 11 blocks
# unreviewed build scripts and, with strictDepBuilds=true (its default),
# makes that blockage a FATAL exit-1 -- which fails `pnpm install` and, in
# turn, `pnpm build`'s pre-run dependency check (verifyDepsBeforeRun=install).
#
# We do not actually need esbuild's postinstall: Vite resolves the
# @esbuild/<platform> binary directly, so the build succeeds without it.
# So we (a) approve it for clean installs, and (b) downgrade the gate from
# fatal to a warning so a cached "Already up to date" install cannot block.
#
# Key names differ across pnpm majors: pnpm 11 uses `allowBuilds` (a map);
# pnpm 10 used `onlyBuiltDependencies` (a list). Each ignores the other's key.
strictDepBuilds: false
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild

# Pin patched versions of transitive dev-only deps flagged by Dependabot.
# All are minor/patch bumps within each dependent's accepted major range.
# Lives here (not package.json "pnpm.overrides") because pnpm 11 no longer
# reads that field.
overrides:
  form-data: ">=4.0.6"
  ws: ">=8.21.0"
  js-yaml: ">=4.2.0"
